[project]
name = "mercury-virtual-solar-wind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "astropy>=8.0.0",
    "cdflib>=1.3.12",
    "gpflow>=2.5.2",
    "hermpy>=0.2.6",
    "polars>=1.42.0",
    "psutil>=7.2.2",
    "pynvml>=13.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "tensorboard>=2.21.0",
    "tensorflow>=2.21.0",
    "tf-keras>=2.21.0",
    "torch>=2.12.1",
    "tqdm>=4.68.3",
    "types-psutil>=7.2.2.20260518",
    "types-requests>=2.33.0.20260518",
    "types-tensorflow>=2.18.0.20260610",
    "types-tqdm>=4.68.0.20260608",
]

[build-system]
requires = ["setuptools"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
